<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#030704">
    <title>BeatDrop is offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #030704; color: #f4f8f5; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 460px); padding: 32px; border: 1px solid #29372f; border-radius: 24px; background: #151b16; }
      h1 { margin: 0 0 12px; color: #39e887; }
      p { line-height: 1.6; color: #b6c5bb; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 12px; background: #19df70; color: #04160b; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>BeatDrop is offline</h1>
      <p>The app shell is ready, but starting rounds, loading artist data, and playing audio previews need an internet connection. Connect again and retry.</p>
      <a href="/play">Try BeatDrop again</a>
    </main>
  </body>
</html>
